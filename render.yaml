services:
  - type: web
    name: django-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application --timeout 120 --workers 2 --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: django-db
          property: connectionString
      # Opcional: Redis para cache (crear Redis en Render y agregar REDIS_URL manualmente)
      # - key: REDIS_URL
      #   fromService:
      #     type: redis
      #     name: barberia-redis
      #     property: connectionString
      # Opcional: Habilitar rate limiting
      # - key: ENABLE_RATE_LIMIT
      #   value: "True"
      # Opcional: Tiempo de cache (segundos)
      # - key: CACHE_TTL
      #   value: "300"
databases:
  - name: django-db
    databaseName: django_production
    user: django_user
